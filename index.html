<!doctype html>

<title>Autohaus KI – Demo</title>

<style>
*{

body{

header{

.bot{

}

.user{

}

.row{
  display:flex;
  gap:8px;
  margin-top:10px
}

.row input{
  flex:1;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px
}

.row button,
.primary{
  background:#111;
  color:#fff;
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-weight:600;
  cursor:pointer
}

.vehicle{

  border-radius:14px;
  padding:14px;
  margin:9px 0
}

.vehicle b{
  font-size:17px
}

.muted{
  color:#666;
  font-size:13px
}

.price{
  font-size:19px;
  font-weight:700;
  margin-top:5px
}

label{
  display:block;
  font-size:13px;
  color:#555;
  margin:9px 0 4px
}

form input,
form select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px
}

form button{
  margin-top:12px
}

#success{
  display:none;
  padding:12px;
  border-radius:10px;
  background:#e9f7ea;
  margin-top:12px
}

/* LEAD-ZENTRALE */

.admin-box{
  background:#f7f7f8;
  border-radius:14px;
  padding:14px;
  margin-bottom:14px
}

.admin-box input{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  margin-bottom:8px
}

.admin-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.admin-actions button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  background:#111;
  color:#fff;
  font-weight:600;
  cursor:pointer
}

.admin-actions button.secondary{
  background:#eee;
  color:#111
}

#leadStatus{
  margin-top:10px;
  font-size:14px;
  color:#666
}

.lead{
  border:1px solid #e5e5e5;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
  background:#fff
}

.lead-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  margin-bottom:10px
}

.lead-name{
  font-size:18px;
  font-weight:700
}

.badge{
  background:#e9f7ea;
  color:#176b24;
  border-radius:20px;
  padding:5px 9px;
  font-size:12px;
  font-weight:600;
  white-space:nowrap
}

.lead-line{
  margin:5px 0;
  font-size:14px
}

.lead-label{
  color:#666;
  font-size:13px
}

.no-leads{
  text-align:center;
  color:#666;
  padding:20px
}

@media(max-width:600px){

  .row{
    flex-direction:column
  }

  .row button{
    width:100%
  }

  .lead-top{
    flex-direction:column
  }

}
</style>

        BMW bis 25.000 €

        Unter 20.000 €
      </button>

      <button onclick="send('Ich möchte eine Probefahrt')">
        Probefahrt
      </button>

    </div>

    <div class="row">

      <input
        id="input"
        placeholder="z. B. Ich suche einen BMW bis 25.000 €"
        onkeydown="if(event.key==='Enter')send()"

        Senden

  <!-- PROBEFAHRT -->

  <div class="card">

      <input id="email" type="email">

      <select id="car"></select>

      <label>Wunschdatum</label>
      <input id="date" type="date">

      <label>Wunschzeit</label>
      <input id="time" type="time">

      <button class="primary" type="submit">
        Probefahrt anfragen
      </button>

    </form>

    <div id="success">
      ✅ Anfrage erfolgreich gespeichert.
    </div>

  </div>


  <!-- FAHRZEUGE -->

  <div class="card">

    <h2>🚘 Fahrzeuge</h2>

    <div id="cars"></div>

  </div>


  <!-- LEAD-ZENTRALE -->

  <div class="card">

    <h2>📋 Lead-Zentrale</h2>

    <div class="admin-box">

      <div class="muted" style="margin-bottom:8px">
        Geschützter Bereich für das Autohaus
      </div>

      <input

        type="password"
        placeholder="Admin-Key eingeben"

      <div class="admin-actions">

        <button onclick="loadLeads()">
          Leads laden
        </button>

        <button
          class="secondary"
          onclick="clearLeads()"
        >
          Zurücksetzen

      </div>

      <div id="leadStatus"></div>

    </div>

    <div id="leads">
      <div class="no-leads">
        🔒 Bitte Admin-Key eingeben und „Leads laden“ drücken.

    </div>

</div>

/* =========================
   HILFSFUNKTIONEN
========================= */

const euro = n =>
  new Intl.NumberFormat(
    "de-DE",
    {
      style:"currency",
      currency:"EUR",
      maximumFractionDigits:0
    }
  ).format(n);


/* =========================
   CHAT
========================= */

const chat = document.getElementById("chat");

function add(text, who){

  const d = document.createElement("div");

  d.className = "msg " + who;

  d.textContent = text;

  chat.appendChild(d);

  chat.scrollTop = chat.scrollHeight;

}


async function send(text){

  const inp = document.getElementById("input");

  const q = text || inp.value.trim();

  if(!q) return;

  add(q,"user");

  inp.value = "";

  const loadingMessage = document.createElement("div");

  loadingMessage.className = "msg bot";

  loadingMessage.textContent = "⏳ Einen Moment...";

  chat.appendChild(loadingMessage);

  chat.scrollTop = chat.scrollHeight;

  try{

    const response = await fetch(
      "/api/chat",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          message:q
        })
      }
    );

    const data = await response.json();

    if(!response.ok){

      console.error("CHAT API ERROR:",data);

      loadingMessage.textContent =
        "Leider ist gerade ein Fehler aufgetreten.";

      return;

    }

    loadingMessage.textContent =
      data.reply || "Keine Antwort erhalten.";

  }catch(error){

    console.error("CHAT CONNECTION ERROR:",error);

    loadingMessage.textContent =
      "Leider konnte ich gerade keine Verbindung zum KI-Assistenten herstellen.";

  }

}


/* =========================
   PROBEFAHRT FORMULAR
========================= */

async function saveLead(e){

  e.preventDefault();

  const lead = {

    name:document.getElementById("name").value,

    phone:document.getElementById("phone").value,

    email:document.getElementById("email").value,

    vehicle_id:document.getElementById("car").value,

    vehicle:
      document.getElementById("car")
      .selectedOptions[0].text,

    test_drive:true,

    date:document.getElementById("date").value,

    time:document.getElementById("time").value,

    message:"Probefahrt-Anfrage",

    status:"Neu"

  };


  try{

    const response = await fetch(
      "/api/leads",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(lead)
      }
    );


    if(!response.ok){

      throw new Error(
        "Lead konnte nicht gespeichert werden"
      );

    }


    document.getElementById(
      "success"
    ).style.display = "block";


  }catch(error){

    console.error(error);

    alert(
      "Die Anfrage konnte gerade nicht gespeichert werden."
    );

  }

}

/* =========================
   LEAD-ZENTRALE
========================= */

async function loadLeads(){

  const key =
    document.getElementById("adminKey").value.trim();

  const status =
    document.getElementById("leadStatus");

  const leadsContainer =
    document.getElementById("leads");


  if(!key){

    status.textContent =
      "Bitte Admin-Key eingeben.";

    return;

  }


  status.textContent =
    "⏳ Leads werden geladen...";


  leadsContainer.innerHTML = "";


  try{

    const response = await fetch(
      "/api/leads",
      {
        method:"GET",
        headers:{
          "x-admin-key":key
        }
      }
    );


    const data = await response.json();


    if(response.status === 401){

      status.textContent =
        "❌ Falscher Admin-Key.";

      leadsContainer.innerHTML =
        `<div class="no-leads">
          Zugriff verweigert.
        </div>`;

      return;

    }


    if(!response.ok){

      console.error(data);

      status.textContent =
        "❌ Leads konnten nicht geladen werden.";

      return;

    }


    status.textContent =
      `✅ ${data.leads.length} Lead(s) geladen.`;


    if(!data.leads.length){

      leadsContainer.innerHTML =
        `<div class="no-leads">
          Noch keine Leads vorhanden.
        </div>`;

      return;

    }


    leadsContainer.innerHTML =
      data.leads
      .map(lead => {

        const date =
          lead.date
          ? new Date(lead.date)
              .toLocaleDateString("de-DE")
          : "-";


        const created =
          lead.created_at
          ? new Date(lead.created_at)
              .toLocaleString("de-DE")
          : "-";


        return `

          <div class="lead">

            <div class="lead-top">

              <div class="lead-name">
                ${escapeHtml(lead.name || "-")}
              </div>

              <div class="badge">
                ${escapeHtml(lead.status || "Neu")}
              </div>

            </div>


            <div class="lead-line">
              <span class="lead-label">
                🚗 Fahrzeug:
              </span>
              ${escapeHtml(lead.vehicle || "-")}
            </div>


            <div class="lead-line">
              <span class="lead-label">
                📅 Probefahrt:
              </span>
              ${date}
              ${lead.time ? " · " + escapeHtml(lead.time.substring(0,5)) : ""}
            </div>


            <div class="lead-line">
              <span class="lead-label">
                📞 Telefon:
              </span>
              ${escapeHtml(lead.phone || "-")}
            </div>


            <div class="lead-line">
              <span class="lead-label">
                ✉️ E-Mail:
              </span>
              ${escapeHtml(lead.email || "-")}
            </div>


            <div class="lead-line">
              <span class="lead-label">
                📝 Nachricht:
              </span>
              ${escapeHtml(lead.message || "-")}
            </div>


            <div class="lead-line muted">
              Erstellt: ${created}
            </div>

          </div>

        `;

      })
      .join("");


  }catch(error){

    console.error(
      "LEAD LOAD ERROR:",
      error
    );

    status.textContent =
      "❌ Verbindung zum Lead-System fehlgeschlagen.";

  }

}


function clearLeads(){

  document.getElementById("adminKey").value = "";

  document.getElementById("leadStatus").textContent = "";

  document.getElementById("leads").innerHTML =
    `<div class="no-leads">
      🔒 Bitte Admin-Key eingeben und „Leads laden“ drücken.
    </div>`;

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   STARTNACHRICHT
========================= */

add(
  "Hallo! 👋 Ich bin der digitale Verkaufsassistent. Ich kann dir passende Fahrzeuge zeigen und eine Probefahrt aufnehmen. Was suchst du?",
